[package]
name = "tenero-gui"
description = "Tenero's wallet app: a desktop window for the wallet that also starts and stops the node and the miner (experimental, unaudited, nothing here has value)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tenero-wallet-gui"
path = "src/bin/tenero_wallet_gui.rs"

[dependencies]
tenero-core = { path = "../tenero-core" }
tenero-store = { path = "../tenero-store" }
tenero-app = { path = "../tenero-app" }
tenero-wallet = { path = "../tenero-wallet" }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

# Approved by the owner 2026-10-03 (rule 3). eframe/egui (MIT OR Apache-2.0): the window, pure Rust, drawn with OpenGL
# (glow) so no GPU API beyond what any Windows PC has. Features cut to the fonts, OpenGL and X11 (no Wayland, no
# screen-reader bridge, no wgpu) to keep the supply chain small.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11"] }
# QR code for the receive screen (MIT OR Apache-2.0), approved by the owner 2026-10-03.
qrcode = { version = "0.14", default-features = false }

# Approved by the owner 2026-10-04 (rule 3). embed-resource (MIT): at build time only, and only on Windows, it compiles `tenero.rc` (the circular icon and the
# version information) into tenero-wallet-gui.exe, so a copied .exe shows the Tenero icon and its file properties. It is not part of the running program.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
