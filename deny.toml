# cargo-deny: what may be in the dependency tree (M9, J1 and J2 of docs/THREAT_MODEL.md). `cargo deny check` is run in CI (rust.yml, job
# `supply-chain`). Written 2026-10-03 from the licences actually in Cargo.lock; every change here is a decision about the tree and goes in
# a commit that says why.

[graph]
# What is built and shipped: Windows and Linux on 64-bit x86. (Crates that exist only for other targets, such as the UEFI and WASI ones, are
# not in what runs.)
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Known vulnerabilities in the locked versions (the RustSec database): any is an error. Nothing is ignored today; an ignore needs its
# advisory id and a comment saying why it does not apply.
version = 2
ignore = []
yanked = "deny"

[licenses]
# Permissive licences only. A crate with a choice of licences (an "OR" expression, such as r-efi's MIT OR Apache-2.0 OR LGPL-2.1-or-later)
# passes if any alternative is on this list. Anything else (GPL, LGPL alone, MPL, unknown) fails until it is looked at and added here
# on purpose.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate is a warning (the build is larger and there are two places to patch), not an error.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
# Only the crates.io registry and the one pinned git dependency (monero-oxide, commit 9e11f5c, MIT: the CLSAG and Bulletproofs+ verifiers).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/monero-oxide/monero-oxide"]
