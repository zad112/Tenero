name: tests

# The Python REFERENCE (reference/): the independent implementation the Rust code is checked against, and the generator of the golden vectors. Not the program.
on:
  push:
    branches: [main]
  pull_request:

# SECURITY: everything runs on GitHub's own hosted runners (free for a public repository), never on the owner's machines (the owner moved the last self-hosted
# jobs here on 2026-10-04). Nothing here uses pull_request_target or secrets; the token is read-only.
permissions:
  contents: read

jobs:
  reference:
    # GitHub's Ubuntu image: the system Python (3.12 today) rather than a Python 3.12/3.13/3.14 matrix: the reference is frozen and supports all three; the older
    # versions were last checked on 2026-10-04 (CI before the move to the owner's runner, and the system Python 3.14 there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r reference/requirements-dev.txt
      # The suite needs no GPU: the CUDA kernels are compiled with g++ and run on the CPU through reference/tests/cuda_emulator.py.
      - name: Test
        working-directory: reference
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q
      - name: The committed vectors match the references
        run: |
          for t in make_vectors make_vectors_v2 make_vectors_v3 make_vectors_address make_vectors_wire make_vectors_control make_vectors_pool make_vectors_interim make_vectors_proofs; do
            "$RUNNER_TEMP/venv/bin/python" reference/tools/$t.py --check
          done
