name: fuzz

# Coverage-guided fuzzing with libFuzzer (docs/THREAT_MODEL.md, A3 and A4). Run by hand ("Run workflow", with the seconds each target may run) or
# once a month. It needs a nightly Rust and Linux, which is why it is here and not on the owner's machine. The work of each target is in
# crates/tenero-fuzzcases (compiled and tested everywhere); a crash is uploaded as an artifact, and becomes a case in
# crates/tenero-fuzzcases/tests/regressions.rs.
# It does NOT run on a push (the owner's choice, 2026-10-04: a run takes too long and holds the Linux runner). The crates/tenero-fuzzcases tests, which run in the rust
# workflow on every push, still check that every target's code works; only the separate fuzz/ crate (the libFuzzer entry points) is compiled by this workflow alone, so
# start it by hand after changing anything under fuzz/.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds each target may run"
        default: "300"
  schedule:
    - cron: "0 5 1 * *"

# SECURITY: no pull_request trigger, so outside code never reaches this self-hosted job: a manual start needs write access, and the schedule is GitHub's own.
permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: [self-hosted, Linux, X64]   # the owner's Linux runner (WSL), since 2026-10-04: one job at a time, so the targets run one after another
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [decode_v2, wire_stream, control_bodies, wallet_proofs, engine_messages, noise_handshake]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # the "nightly" branch
        with:
          toolchain: nightly
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
            ~/.cargo/bin/cargo-fuzz
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}-cargo-fuzz-0.13
      - name: install cargo-fuzz (first run)
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - name: seeds
        run: cargo run --release -p tenero-fuzzcases --example write_seeds -- fuzz/corpus
      - name: fuzz ${{ matrix.target }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || (github.event_name == 'push' && '120') || '300' }} -max_len=65536 -rss_limit_mb=3072
      - name: keep a crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
