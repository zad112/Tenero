name: supply-chain

# What is in the dependency tree (docs/THREAT_MODEL.md, J1 and J2): known vulnerabilities (cargo audit and cargo deny's advisories), licences,
# banned or unknown sources (deny.toml). It also runs every Monday, because a new advisory can turn a tree that was fine red with no change
# of ours: that is the point of it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# SECURITY (the repository is, or will be, public): a pull request from a FORK is outside code. It runs on GitHub's own hosted runners (free for a public
# repository), never on the owner's machines. Only pushes to main and pull requests from branches of this repository (which need write access) run on the
# self-hosted runners. Nothing here uses pull_request_target or secrets; the token is read-only.
permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny-and-audit:
    name: cargo deny and cargo audit
    # the owner's Linux runner (WSL), except for a pull request from a fork (see above)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # the "stable" branch
        with:
          toolchain: stable
      # The two tools take several minutes to build; they are kept between runs (the key names their versions, so a new version is a new build).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: supply-chain-tools-deny-0.20.2-audit-0.22.2
      - name: build the tools (first run, or a new version)
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny check
      - run: cargo audit
