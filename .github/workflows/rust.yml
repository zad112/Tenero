name: rust

on:
  push:
    branches: [main]
  pull_request:

# Everything runs on GitHub's own hosted runners (free for a public repository), never on the owner's machines: a pull request from a fork is outside code.
# (Until 2026-10-04 the owner's Windows and Linux machines ran these jobs; the owner moved both to GitHub's runners.) Nothing here uses pull_request_target or
# secrets; the token is read-only.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless: cancel it instead of queueing (the Windows job is slow).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# No incremental builds and no debug info on a runner that starts empty every time: less to write, a smaller cache.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runner: ubuntu-latest
          - name: windows
            runner: windows-latest
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # the "stable" branch
        if: matrix.name == 'ubuntu'
        with:
          toolchain: stable
          components: clippy, rustfmt
      # A hosted runner starts empty every time, and compiling the workspace (the window library above all) is most of a run. The key follows Cargo.lock and the OS.
      # (Measured 2026-10-04 on Windows: with the cache, clippy 34 s instead of 68 s and the test build 186 s instead of 248 s.)
      - name: keep the build between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      # The rust-toolchain action is not used on Windows: GitHub's Windows image already has Rust (stable, with clippy and rustfmt), so use it as it is
      - name: use the installed Rust (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.cargo\bin\rustc.exe" --version
          & "$env:USERPROFILE\.cargo\bin\cargo.exe" clippy --version
          & "$env:USERPROFILE\.cargo\bin\cargo.exe" fmt --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests are built in a step of their own, so the log says how long the build takes and how long the tests take
      - name: build the tests
        run: cargo test --workspace --no-run
      - run: cargo test --workspace
