name: rust

on:
  push:
    branches: [main, rewrite]
  pull_request:

# A newer push to the same branch makes the older run pointless: cancel it instead of queueing (the Windows job is slow).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows runs on the owner's own machine (a self-hosted runner), not on GitHub's metered minutes
        include:
          - name: ubuntu
            runner: '"ubuntu-latest"'
          - name: windows
            runner: '["self-hosted", "Windows", "X64"]'
    name: test (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
