name: rust

on:
  push:
    branches: [main, rewrite]
  pull_request:

# A newer push to the same branch makes the older run pointless: cancel it instead of queueing (the Windows job is slow).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both run on the owner's own machine (self-hosted runners: Windows, and Linux in WSL since 2026-10-04), not on GitHub's metered minutes
        include:
          - name: ubuntu
            runner: '["self-hosted", "Linux", "X64"]'
          - name: windows
            runner: '["self-hosted", "Windows", "X64"]'
    name: test (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # the "stable" branch
        if: matrix.name == 'ubuntu'
        with:
          toolchain: stable
          components: clippy, rustfmt
      # On the owner's machine that action fails (its `bash` is the WSL launcher, with no distro installed), and the toolchain is
      # already there: use it as it is (so Windows can be a Rust release behind or ahead of Ubuntu)
      - name: use the installed Rust (self-hosted Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.cargo\bin\rustc.exe" --version
          & "$env:USERPROFILE\.cargo\bin\cargo.exe" clippy --version
          & "$env:USERPROFILE\.cargo\bin\cargo.exe" fmt --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
