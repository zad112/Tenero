[workspace]
resolver = "2"
members = ["crates/tenero-core", "crates/tenero-gpu", "crates/tenero-store", "crates/tenero-chain", "crates/tenero-crypto", "crates/tenero-node", "crates/tenero-net", "crates/tenero-miner", "crates/tenero-wallet", "crates/tenero-app", "crates/tenero-fuzzcases", "crates/tenero-gui", "crates/tenero-explorer"]

[workspace.package]
version = "0.2.0-beta.4"
edition = "2021"
license = "BSD-3-Clause"
publish = false

# The proof-of-work tests build datasets and do billions of multiply-adds: unoptimised is far too
# slow. Overflow checks stay on in tests, so an accidental overflow fails a test.
[profile.test]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
